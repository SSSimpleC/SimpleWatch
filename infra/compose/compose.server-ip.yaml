name: simplewatch-server

x-service-logging: &service-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    build:
      context: ../..
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
        APT_MIRROR: mirrors.aliyun.com
    image: simplewatch-app:${RELEASE_TAG}
    restart: unless-stopped
    logging: *service-logging
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.35
    mem_limit: 384m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    command: ["node", "dist/api.mjs"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /state/simplewatch.sqlite3
      MEDIA_ROOT: /media
      UPLOAD_ROOT: /uploads
      INBOX_ROOT: /inbox
      SUBTITLE_ROOT: /subtitles
      TRASH_ROOT: /trash
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      CONTENT_SIGNING_SECRET: ${CONTENT_SIGNING_SECRET:?CONTENT_SIGNING_SECRET is required}
      TUS_ENDPOINT: ${TUS_ENDPOINT:?TUS_ENDPOINT is required}
      INTERNAL_HOOK_TOKEN: ${INTERNAL_HOOK_TOKEN:?INTERNAL_HOOK_TOKEN is required}
      MEDIA_JWT_SECRET: ${MEDIA_JWT_SECRET:?MEDIA_JWT_SECRET is required}
      OBS_CREDENTIAL_ENCRYPTION_KEY: ${OBS_CREDENTIAL_ENCRYPTION_KEY:?OBS_CREDENTIAL_ENCRYPTION_KEY is required}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:?MEDIA_ORIGIN is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      MEDIAMTX_CONTROL_URL: http://mediamtx:9997
    volumes:
      - /srv/simplewatch/state:/state
      - /srv/simplewatch/media:/media
      - /srv/simplewatch/uploads:/uploads
      - /srv/simplewatch/inbox:/inbox
      - /srv/simplewatch/subtitles:/subtitles
      - /srv/simplewatch/trash:/trash
      - /srv/simplewatch/sftp/incoming:/sftp-incoming
    networks: [sw_app]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  worker:
    image: simplewatch-app:${RELEASE_TAG}
    restart: unless-stopped
    logging: *service-logging
    group_add: ["12001"]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.35
    mem_limit: 320m
    pids_limit: 96
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    command: ["node", "dist/worker.mjs"]
    environment:
      API_ORIGIN: http://app:3000
      WORKER_ID: server-worker
      INTERNAL_HOOK_TOKEN: ${INTERNAL_HOOK_TOKEN:?INTERNAL_HOOK_TOKEN is required}
      MEDIA_ROOT: /media
      UPLOAD_ROOT: /uploads
      INBOX_ROOT: /inbox
      SUBTITLE_ROOT: /subtitles
      FFPROBE_PATH: /usr/bin/ffprobe
      FFMPEG_PATH: /usr/bin/ffmpeg
      SFTP_INCOMING_ROOT: /sftp-incoming
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      MEDIAMTX_CONTROL_URL: http://mediamtx:9997
    volumes:
      - /srv/simplewatch/media:/media
      - /srv/simplewatch/uploads:/uploads
      - /srv/simplewatch/inbox:/inbox
      - /srv/simplewatch/subtitles:/subtitles
      - /srv/simplewatch/sftp/incoming:/sftp-incoming
    networks: [sw_app]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const u=new URL('/api/v1/internal/worker/health','http://app:3000');u.searchParams.set('workerId',process.env.WORKER_ID);fetch(u,{headers:{'X-Internal-Token':process.env.INTERNAL_HOOK_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  caddy:
    image: docker.m.daocloud.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *service-logging
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 0.20
    mem_limit: 160m
    pids_limit: 96
    group_add: ["1000"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      INTERNAL_HOOK_TOKEN: ${INTERNAL_HOOK_TOKEN:?INTERNAL_HOOK_TOKEN is required}
    ports:
      - "80:8080"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.server-ip:/etc/caddy/Caddyfile:ro
      - /srv/simplewatch/ip-cert:/etc/caddy/ip-cert:ro
      - /srv/simplewatch/acme-webroot:/var/www/acme:ro
      - /srv/simplewatch/media:/srv/simplewatch/media:ro
      - /srv/simplewatch/caddy-data:/data
      - /srv/simplewatch/caddy-config:/config
    networks: [sw_app, sw_edge]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 24

  tusd:
    image: docker.m.daocloud.io/tusproject/tusd:v2.9.2
    restart: unless-stopped
    logging: *service-logging
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.12
    mem_limit: 160m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -behind-proxy
      - -upload-dir=/uploads
      - -hooks-http=http://caddy:8081/api/v1/internal/tus/hooks
      - -hooks-http-forward-headers=Upload-Token
      - -hooks-enabled-events=pre-create,post-create,post-receive,post-finish,post-terminate
    volumes:
      - /srv/simplewatch/uploads:/uploads
    networks: [sw_app]
    depends_on:
      app:
        condition: service_healthy

  mediamtx:
    build:
      context: ../..
      dockerfile: infra/images/mediamtx/Dockerfile
      args:
        MEDIAMTX_ARCHIVE_SHA256: ${MEDIAMTX_ARCHIVE_SHA256}
    image: simplewatch-mediamtx:${RELEASE_TAG}
    restart: unless-stopped
    logging: *service-logging
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.50
    mem_limit: 320m
    pids_limit: 128
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    volumes:
      - ../mediamtx/mediamtx.server-ip.yml:/mediamtx.yml:ro
    networks: [sw_app, sw_rtc_egress]
    depends_on:
      app:
        condition: service_healthy

  livekit:
    build:
      context: ../..
      dockerfile: infra/images/livekit/Dockerfile
      args:
        LIVEKIT_ARCHIVE_SHA256: ${LIVEKIT_ARCHIVE_SHA256}
    image: simplewatch-livekit:${RELEASE_TAG}
    restart: unless-stopped
    logging: *service-logging
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.50
    mem_limit: 448m
    pids_limit: 192
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7881:7881/tcp"
      - "7882-7883:7882-7883/udp"
    volumes:
      - ../livekit/livekit.server-ip.yaml:/etc/livekit.yaml:ro
    networks: [sw_app, sw_rtc_egress]
    depends_on:
      app:
        condition: service_healthy

networks:
  sw_app:
    internal: true
  sw_edge: {}
  sw_rtc_egress: {}
