openapi: 3.0.3
info:
  title: SimpleWatch API
  version: 0.1.0
components:
  schemas: {}
paths:
  /health/live:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /health/ready:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                  database:
                    type: string
                    enum:
                      - ok
                  worker:
                    type: object
                    properties:
                      health:
                        type: string
                        enum:
                          - healthy
                          - stale
                          - missing
                      workerId:
                        nullable: true
                        type: string
                      status:
                        nullable: true
                        type: string
                        enum:
                          - idle
                          - busy
                          - degraded
                      currentJobId:
                        nullable: true
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      lastSeenAt:
                        nullable: true
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      ageMs:
                        nullable: true
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                      - health
                      - workerId
                      - status
                      - currentJobId
                      - lastSeenAt
                      - ageMs
                    additionalProperties: false
                required:
                  - status
                  - database
                  - worker
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - not-ready
                  database:
                    type: string
                    enum:
                      - ok
                  worker:
                    type: object
                    properties:
                      health:
                        type: string
                        enum:
                          - healthy
                          - stale
                          - missing
                      workerId:
                        nullable: true
                        type: string
                      status:
                        nullable: true
                        type: string
                        enum:
                          - idle
                          - busy
                          - degraded
                      currentJobId:
                        nullable: true
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      lastSeenAt:
                        nullable: true
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      ageMs:
                        nullable: true
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                      - health
                      - workerId
                      - status
                      - currentJobId
                      - lastSeenAt
                      - ageMs
                    additionalProperties: false
                required:
                  - status
                  - database
                  - worker
                additionalProperties: false
  /api/v1/edge/v1/heartbeat:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protocolVersion:
                  type: integer
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                softwareVersion:
                  type: string
                  minLength: 1
                  maxLength: 120
                capabilities:
                  type: object
                  additionalProperties: {}
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/edge/v1/catalog/scans:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                generation:
                  type: integer
                  exclusiveMinimum: true
                  maximum: 9007199254740991
              required:
                - generation
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  generation:
                    type: integer
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                required:
                  - scanId
                  - generation
                additionalProperties: false
  /api/v1/edge/v1/catalog/scans/{scanId}/pages:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                generation:
                  type: integer
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                pageIndex:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                entries:
                  maxItems: 2000
                  type: array
                  items:
                    type: object
                    properties:
                      localId:
                        type: string
                        minLength: 1
                        maxLength: 512
                      relativePath:
                        type: string
                        minLength: 1
                        maxLength: 2048
                      displayName:
                        type: string
                        minLength: 1
                        maxLength: 255
                      bytes:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      mtimeMs:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - localId
                      - relativePath
                      - displayName
                      - bytes
                      - mtimeMs
              required:
                - generation
                - pageIndex
                - entries
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: scanId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                required:
                  - accepted
                additionalProperties: false
  /api/v1/edge/v1/catalog/scans/{scanId}/commit:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                generation:
                  type: integer
                  exclusiveMinimum: true
                  maximum: 9007199254740991
                pageCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - generation
                - pageCount
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: scanId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  changedCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - itemCount
                  - changedCount
                additionalProperties: false
  /api/v1/edge/v1/jobs/claim:
    get:
      parameters:
        - schema:
            default: 25
            type: integer
            minimum: 0
            maximum: 25
          in: query
          name: waitSeconds
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  leaseToken:
                    type: string
                    minLength: 32
                    maxLength: 512
                  leaseExpiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  attempts:
                    type: integer
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                  maxAttempts:
                    type: integer
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                  payload:
                    oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                              - catalog_scan
                          generation:
                            type: integer
                            exclusiveMinimum: true
                            maximum: 9007199254740991
                        required:
                          - kind
                          - generation
                        additionalProperties: false
                      - type: object
                        properties:
                          catalogItemId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          catalogVersionId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          localId:
                            type: string
                            minLength: 1
                            maxLength: 512
                          expectedBytes:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          expectedMtimeMs:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          expectedSha256:
                            nullable: true
                            type: string
                            pattern: ^[a-f0-9]{64}$
                          kind:
                            type: string
                            enum:
                              - upload
                          edgeTransferId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        required:
                          - catalogItemId
                          - catalogVersionId
                          - localId
                          - expectedBytes
                          - expectedMtimeMs
                          - expectedSha256
                          - kind
                          - edgeTransferId
                        additionalProperties: false
                      - type: object
                        properties:
                          catalogItemId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          catalogVersionId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          localId:
                            type: string
                            minLength: 1
                            maxLength: 512
                          expectedBytes:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          expectedMtimeMs:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          expectedSha256:
                            nullable: true
                            type: string
                            pattern: ^[a-f0-9]{64}$
                          kind:
                            type: string
                            enum:
                              - verify_source
                          edgeTransferId:
                            nullable: true
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                          cacheReplicaId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        required:
                          - catalogItemId
                          - catalogVersionId
                          - localId
                          - expectedBytes
                          - expectedMtimeMs
                          - expectedSha256
                          - kind
                          - edgeTransferId
                          - cacheReplicaId
                        additionalProperties: false
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                              - cancel_transfer
                          edgeTransferId:
                            type: string
                            format: uuid
                            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        required:
                          - kind
                          - edgeTransferId
                        additionalProperties: false
                required:
                  - id
                  - leaseToken
                  - leaseExpiresAt
                  - attempts
                  - maxAttempts
                  - payload
                additionalProperties: false
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/edge/v1/jobs/{jobId}/upload-credential:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseToken:
                  type: string
                  minLength: 32
                  maxLength: 512
                source:
                  type: object
                  properties:
                    bytes:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    mtimeMs:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                  required:
                    - bytes
                    - mtimeMs
                    - sha256
              required:
                - leaseToken
                - source
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: jobId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  edgeTransferId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  uploadId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  tusUrl:
                    type: string
                    minLength: 1
                    maxLength: 4096
                  token:
                    type: string
                    minLength: 32
                    maxLength: 4096
                  expiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  refreshAfter:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  chunkBytes:
                    type: integer
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                required:
                  - edgeTransferId
                  - uploadId
                  - tusUrl
                  - token
                  - expiresAt
                  - refreshAfter
                  - chunkBytes
                additionalProperties: false
  /api/v1/edge/v1/jobs/{jobId}/heartbeat:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseToken:
                  type: string
                  minLength: 32
                  maxLength: 512
                bytesTransferred:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - leaseToken
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: jobId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaseExpiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  cancelRequested:
                    type: boolean
                required:
                  - leaseExpiresAt
                  - cancelRequested
                additionalProperties: false
  /api/v1/edge/v1/jobs/{jobId}/cancelled:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseToken:
                  type: string
                  minLength: 32
                  maxLength: 512
              required:
                - leaseToken
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: jobId
          required: true
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/edge/v1/jobs/{jobId}/complete:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseToken:
                  type: string
                  minLength: 32
                  maxLength: 512
                source:
                  type: object
                  properties:
                    bytes:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    mtimeMs:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    sha256:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                  required:
                    - bytes
                    - mtimeMs
                    - sha256
              required:
                - leaseToken
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: jobId
          required: true
      responses:
        "204":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
                nullable: true
                enum:
                  - null
  /api/v1/edge/v1/jobs/{jobId}/fail:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseToken:
                  type: string
                  minLength: 32
                  maxLength: 512
                code:
                  type: string
                  enum:
                    - SOURCE_MISSING
                    - SOURCE_CHANGED
                    - PERMISSION_DENIED
                    - INSUFFICIENT_STORAGE
                    - TRANSFER_STALLED
                    - NETWORK_ERROR
                    - INTERNAL_ERROR
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
                retryable:
                  type: boolean
              required:
                - leaseToken
                - code
                - message
                - retryable
      parameters:
        - schema:
